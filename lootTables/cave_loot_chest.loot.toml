# 洞穴宝箱掉落表
# 权重为相对权重：某条目概率 = weight / (empty_weight + 所有 pool 权重之和)
# 本表权重合计 100，因此权重值即对应百分比。
resource_id = "cave_loot_chest"
rolls = 3
empty_weight = 0

# 必掉：火把 1-2 个。开箱必有所得，洞穴照明刚需。
[[mandatory]]
min = 1
max = 2

[mandatory.item]
pack_id = "@self"
resource_key = "coal_torch"
resource_type = "tile"

